MOD_PIXINDEX="PixIndex - Indice dei contenuti"
MOD_PIXINDEX_XML_DESCRIPTION="Crea in automatico l'indice dei capitoli di un articolo partendo dai suoi titoli (h1-h6). Funziona con Cassiopeia (Bootstrap 5) e YOOtheme (UIkit 3), evidenzia il capitolo in lettura e ha una versione apposita per smartphone."

; Front-end strings
MOD_PIXINDEX_INDEX_TITLE="Indice dei contenuti"
MOD_PIXINDEX_BACK_TO_INDEX="Torna all'indice"
MOD_PIXINDEX_TOGGLE_SUBLEVELS="Mostra o nascondi i sottocapitoli di %s"

; Tabs
MOD_PIXINDEX_FIELDSET_LISTS="Elenco"
MOD_PIXINDEX_FIELDSET_BEHAVIOUR="Comportamento"
MOD_PIXINDEX_FIELDSET_IDS="Link dei capitoli"
MOD_PIXINDEX_FIELDSET_FILTERS="Filtri"
MOD_PIXINDEX_FIELDSET_STYLING="Classi CSS"

; Tab introductions
MOD_PIXINDEX_INTRO_BASIC="Qui scegli l'aspetto generale dell'indice e quali titoli dell'articolo deve elencare. Per partire bastano <strong>Framework di stile</strong> e <strong>Visualizzazione</strong>: tutte le altre impostazioni del modulo hanno già valori adatti alla maggior parte dei siti."
MOD_PIXINDEX_INTRO_LISTS="Qui decidi come appaiono le voci dell'indice: numeri o punti elenco, numerazione dei sottocapitoli, lunghezza massima e pulizia del testo. Queste opzioni cambiano solo l'indice, mai i titoli dentro l'articolo."
MOD_PIXINDEX_INTRO_BEHAVIOUR="Qui decidi cosa succede quando il visitatore usa l'indice e scorre la pagina: scorrimento fluido, evidenziazione del capitolo che sta leggendo, sottocapitoli che si aprono da soli, indice sempre visibile e pulsante per smartphone."
MOD_PIXINDEX_INTRO_IDS="Ogni capitolo riceve un indirizzo che compare alla fine del link, ad esempio <code>pagina.html#installazione</code>. È ciò che permette all'indice di portare al punto giusto e ai visitatori di condividere il link a un singolo capitolo. Di solito non serve cambiare nulla."
MOD_PIXINDEX_INTRO_FILTERS="Qui decidi quali titoli entrano nell'indice e in quali pagine compare il modulo. I valori predefiniti escludono già il titolo dell'articolo e i contenuti che non fanno parte del testo (commenti, campi aggiuntivi): di solito non serve cambiarli."
MOD_PIXINDEX_INTRO_STYLING="Per utenti esperti. Lascia i campi vuoti per usare le classi standard di Bootstrap o UIkit scelte nella scheda Modulo: l'indice prende in automatico font e colori del tema. Compila un campo solo se vuoi sostituire quelle classi con le tue."
MOD_PIXINDEX_INTRO_ADVANCED="Impostazioni standard di Joomla per tutti i moduli: layout alternativo, classi del modulo e contenitore HTML."

; Module tab
MOD_PIXINDEX_FIELD_FRAMEWORK_LABEL="Framework di stile"
MOD_PIXINDEX_FIELD_FRAMEWORK_DESC="Scegli in base al tema del sito: Bootstrap 5 per Cassiopeia e i temi basati su Bootstrap, UIkit 3 per YOOtheme Pro e i temi basati su UIkit. «Nessuno» usa solo uno stile minimo del modulo."
MOD_PIXINDEX_OPTION_BOOTSTRAP5="Bootstrap 5 (Cassiopeia)"
MOD_PIXINDEX_OPTION_UIKIT3="UIkit 3 (YOOtheme)"
MOD_PIXINDEX_OPTION_NONE="Nessuno"
MOD_PIXINDEX_FIELD_DISPLAY_LABEL="Visualizzazione"
MOD_PIXINDEX_FIELD_DISPLAY_DESC="Card: indice in un riquadro con intestazione. Elenco: titolo seguito da un elenco semplice. Navigazione: menu verticale, ideale in una colonna laterale."
MOD_PIXINDEX_OPTION_DISPLAY_CARD="Card"
MOD_PIXINDEX_OPTION_DISPLAY_LIST="Elenco"
MOD_PIXINDEX_OPTION_DISPLAY_NAV="Navigazione"
MOD_PIXINDEX_FIELD_APPEARANCE_LABEL="Aspetto"
MOD_PIXINDEX_FIELD_APPEARANCE_DESC="Vetro: riquadro semitrasparente con sfondo sfocato, bordo sottile, angoli arrotondati e voci evidenziate al passaggio del mouse; i toni sono calcolati dal colore del testo del tema, quindi funziona sia con temi chiari sia scuri. Standard del tema: solo lo stile di Bootstrap o UIkit."
MOD_PIXINDEX_OPTION_APPEARANCE_GLASS="Vetro (glassmorphism)"
MOD_PIXINDEX_OPTION_APPEARANCE_THEME="Standard del tema"
MOD_PIXINDEX_FIELD_COLLAPSIBLE_LABEL="Richiudibile"
MOD_PIXINDEX_FIELD_COLLAPSIBLE_DESC="Il titolo dell'indice diventa un pulsante che apre e chiude l'elenco (in questo caso il titolo è sempre visibile). «Chiuso solo su smartphone»: aperto sugli schermi grandi, chiuso su quelli piccoli."
MOD_PIXINDEX_OPTION_COLLAPSIBLE_EXPANDED="Sì, aperto all'inizio"
MOD_PIXINDEX_OPTION_COLLAPSIBLE_COLLAPSED="Sì, chiuso all'inizio"
MOD_PIXINDEX_OPTION_COLLAPSIBLE_MOBILE="Sì, chiuso solo su smartphone"
MOD_PIXINDEX_FIELD_SHOW_TITLE_LABEL="Titolo dell'indice"
MOD_PIXINDEX_FIELD_SHOW_TITLE_DESC="Mostra un titolo sopra l'indice."
MOD_PIXINDEX_FIELD_TITLE_LABEL="Testo del titolo"
MOD_PIXINDEX_FIELD_TITLE_DESC="Lascia il valore predefinito per avere «Indice dei contenuti» tradotto in automatico in ogni lingua del sito, oppure scrivi il tuo testo."
MOD_PIXINDEX_FIELD_TITLE_TAG_LABEL="Tag HTML del titolo"
MOD_PIXINDEX_FIELD_TITLE_TAG_DESC="Tag HTML usato per il titolo dell'indice. h3 va bene nella maggior parte dei casi."
MOD_PIXINDEX_FIELD_INDEX_MIN_LABEL="Dal livello"
MOD_PIXINDEX_FIELD_INDEX_MIN_DESC="Primo livello di titolo incluso nell'indice. Con h2 (predefinito) l'indice parte dai titoli h2 e ignora gli h1, che di solito sono il titolo della pagina."
MOD_PIXINDEX_FIELD_INDEX_MAX_LABEL="Fino al livello"
MOD_PIXINDEX_FIELD_INDEX_MAX_DESC="Ultimo livello di titolo incluso nell'indice. Ad esempio con h3 l'indice mostra solo h2 e h3."
MOD_PIXINDEX_FIELD_EXCLUDE_LEVELS_LABEL="Escludi livelli"
MOD_PIXINDEX_FIELD_EXCLUDE_LEVELS_DESC="Livelli di titolo da ignorare sempre, anche se rientrano tra «Dal livello» e «Fino al livello»."
MOD_PIXINDEX_FIELD_MIN_HEADINGS_LABEL="Numero minimo di voci"
MOD_PIXINDEX_FIELD_MIN_HEADINGS_DESC="Se l'articolo ha meno titoli di questo numero, il modulo non viene mostrato."

; List tab
MOD_PIXINDEX_FIELD_ORDERED_LABEL="Voci numerate"
MOD_PIXINDEX_FIELD_ORDERED_DESC="Scegli se le voci sono numerate (1, 2, 3...) oppure no. Con «Diverso per ogni livello» decidi livello per livello: il livello 1 è il primo livello dell'indice, i livelli 2, 3... sono i sottocapitoli."
MOD_PIXINDEX_OPTION_ORDERED_YES="Sì"
MOD_PIXINDEX_OPTION_ORDERED_NO="No"
MOD_PIXINDEX_OPTION_ORDERED_CUSTOM="Diverso per ogni livello"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_LABEL="Tipo di numerazione"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_DESC="Numeri, lettere o numeri romani."
MOD_PIXINDEX_OPTION_STYLE_NUMBERS="1, 2, 3"
MOD_PIXINDEX_OPTION_STYLE_LETTERS="A, B, C"
MOD_PIXINDEX_OPTION_STYLE_LETTERS_LOWERCASE="a, b, c"
MOD_PIXINDEX_OPTION_STYLE_ROMAN="I, II, III"
MOD_PIXINDEX_OPTION_STYLE_ROMAN_LOWERCASE="i, ii, iii"
MOD_PIXINDEX_FIELD_ORDERED_1_LABEL="Livello 1 numerato"
MOD_PIXINDEX_FIELD_ORDERED_2_LABEL="Livello 2 numerato"
MOD_PIXINDEX_FIELD_ORDERED_3_LABEL="Livello 3 numerato"
MOD_PIXINDEX_FIELD_ORDERED_4_LABEL="Livello 4 numerato"
MOD_PIXINDEX_FIELD_ORDERED_5_LABEL="Livello 5 numerato"
MOD_PIXINDEX_FIELD_ORDERED_6_LABEL="Livello 6 numerato"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_1_LABEL="Livello 1: tipo di numerazione"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_2_LABEL="Livello 2: tipo di numerazione"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_3_LABEL="Livello 3: tipo di numerazione"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_4_LABEL="Livello 4: tipo di numerazione"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_5_LABEL="Livello 5: tipo di numerazione"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_6_LABEL="Livello 6: tipo di numerazione"
MOD_PIXINDEX_FIELD_INDEX_NUMBERING_LABEL="Numeri dei sottocapitoli"
MOD_PIXINDEX_FIELD_INDEX_NUMBERING_DESC="Semplici: i sottocapitoli ricominciano da 1 (1, 2, 3). Completi: ogni voce mostra anche il numero del capitolo superiore (2.1, 2.2, 2.3). La visualizzazione Navigazione usa sempre i numeri completi."
MOD_PIXINDEX_OPTION_NUMBERING_MARKERS="Semplici (1, 2, 3)"
MOD_PIXINDEX_OPTION_NUMBERING_HIERARCHICAL="Completi (2.1, 2.2, 2.3)"
MOD_PIXINDEX_FIELD_NUMBER_SEPARATOR_LABEL="Carattere dopo il numero"
MOD_PIXINDEX_FIELD_NUMBER_SEPARATOR_DESC="Carattere mostrato dopo i numeri completi, ad esempio il punto finale in «2.3.». Può essere lasciato vuoto."
MOD_PIXINDEX_FIELD_LIST_BULLETS_LABEL="Punti elenco"
MOD_PIXINDEX_FIELD_LIST_BULLETS_DESC="Mostra o nasconde il puntino davanti alle voci non numerate. I sottocapitoli restano comunque rientrati."
MOD_PIXINDEX_FIELD_TRUNCATE_LENGTH_LABEL="Lunghezza massima delle voci (caratteri)"
MOD_PIXINDEX_FIELD_TRUNCATE_LENGTH_DESC="Le voci più lunghe di questo numero di caratteri (spazi compresi) vengono accorciate e terminano con «…». Passando il mouse sulla voce si legge il titolo completo. 0 = nessun limite."
MOD_PIXINDEX_FIELD_TRUNCATE_WHOLE_WORDS_LABEL="Non spezzare le parole"
MOD_PIXINDEX_FIELD_TRUNCATE_WHOLE_WORDS_DESC="Sì: se il limite cade a metà di una parola, la parola viene completata e i puntini arrivano subito dopo (la voce può quindi superare di poco il limite). No: il taglio avviene esattamente al numero di caratteri indicato."
MOD_PIXINDEX_FIELD_REMOVE_HTML_LABEL="Solo testo semplice"
MOD_PIXINDEX_FIELD_REMOVE_HTML_DESC="Sì: le voci mostrano solo il testo del titolo. No: mantengono la formattazione semplice del titolo, come grassetto, corsivo o codice."
MOD_PIXINDEX_FIELD_SANITIZE_TITLES_LABEL="Rimuovi emoji e simboli"
MOD_PIXINDEX_FIELD_SANITIZE_TITLES_DESC="Pulisce il testo delle voci. «Solo emoji»: toglie emoji, icone e caratteri invisibili. «Emoji e simboli»: toglie anche stelle, spunte, frecce e i trattini o i due punti all'inizio e alla fine. I titoli nell'articolo restano invariati."
MOD_PIXINDEX_OPTION_SANITIZE_EMOJI="Solo emoji"
MOD_PIXINDEX_OPTION_SANITIZE_STRICT="Emoji e simboli"

; Behaviour tab
MOD_PIXINDEX_FIELD_SMOOTH_SCROLL_LABEL="Scorrimento fluido"
MOD_PIXINDEX_FIELD_SMOOTH_SCROLL_DESC="Cliccando una voce la pagina scorre dolcemente fino al capitolo invece di saltare. Per chi ha chiesto di ridurre le animazioni nelle impostazioni del dispositivo il salto resta immediato."
MOD_PIXINDEX_FIELD_SCROLL_OFFSET_LABEL="Spazio sopra il capitolo (px)"
MOD_PIXINDEX_FIELD_SCROLL_OFFSET_DESC="Se il sito ha un menu fisso in alto, inserisci qui la sua altezza: il titolo del capitolo non finirà nascosto sotto il menu. 0 = nessuno spazio."
MOD_PIXINDEX_FIELD_SCROLLSPY_LABEL="Evidenzia il capitolo in lettura"
MOD_PIXINDEX_FIELD_SCROLLSPY_DESC="Mentre il visitatore scorre la pagina, la voce del capitolo che sta leggendo viene evidenziata nell'indice."
MOD_PIXINDEX_FIELD_ACTIVE_STYLE_LABEL="Come evidenziarlo"
MOD_PIXINDEX_FIELD_ACTIVE_STYLE_DESC="Usa sempre i colori del tuo tema. «Sfondo e barra laterale»: la voce ha uno sfondo più chiaro sui temi scuri (più scuro sui temi chiari) e una barra a sinistra nel colore dei link. Automatico: sfondo e barra laterale, tranne nella Navigazione con Bootstrap dove la voce attiva è già evidenziata."
MOD_PIXINDEX_OPTION_ACTIVE_AUTO="Automatico"
MOD_PIXINDEX_OPTION_ACTIVE_HIGHLIGHT="Sfondo e barra laterale"
MOD_PIXINDEX_OPTION_ACTIVE_UNDERLINE="Sottolineato"
MOD_PIXINDEX_OPTION_ACTIVE_BOLD="Grassetto"
MOD_PIXINDEX_OPTION_ACTIVE_LINE="Barra laterale"
MOD_PIXINDEX_OPTION_ACTIVE_NONE="Lascia decidere al tema"
MOD_PIXINDEX_FIELD_COLLAPSE_SUBLEVELS_LABEL="Sottocapitoli richiudibili"
MOD_PIXINDEX_FIELD_COLLAPSE_SUBLEVELS_DESC="Utile per gli indici lunghi. Le voci con sottocapitoli hanno un pulsante con la freccia per aprirli e chiuderli, con una breve animazione; all'inizio sono chiuse. Scorrendo la pagina si apre da solo il gruppo del capitolo in lettura, mentre quelli aperti a mano restano aperti."
MOD_PIXINDEX_FIELD_STICKY_LABEL="Indice sempre visibile"
MOD_PIXINDEX_FIELD_STICKY_DESC="L'indice resta fermo sullo schermo mentre la pagina scorre: ideale in una colonna laterale. Vale solo per gli schermi più larghi della «Larghezza smartphone»."
MOD_PIXINDEX_FIELD_STICKY_TOP_LABEL="Distanza dall'alto (px)"
MOD_PIXINDEX_FIELD_STICKY_TOP_DESC="Spazio tra il bordo superiore dello schermo e l'indice fermo. Se il sito ha un menu fisso in alto, usa un valore un po' più grande della sua altezza."
MOD_PIXINDEX_FIELD_MAX_HEIGHT_LABEL="Altezza massima (px)"
MOD_PIXINDEX_FIELD_MAX_HEIGHT_DESC="Se l'indice è più alto di questo valore compare una barra di scorrimento interna. 0 = nessun limite."
MOD_PIXINDEX_FIELD_MOBILE_PANEL_LABEL="Pulsante per smartphone"
MOD_PIXINDEX_FIELD_MOBILE_PANEL_DESC="Sugli schermi piccoli l'indice viene nascosto e al suo posto compare un pulsante rotondo in basso: toccandolo, l'indice si apre in un pannello laterale."
MOD_PIXINDEX_FIELD_MOBILE_PANEL_SIDE_LABEL="Posizione del pulsante"
MOD_PIXINDEX_FIELD_MOBILE_PANEL_SIDE_DESC="Angolo in cui compare il pulsante e lato da cui si apre il pannello. Nei siti in lingue scritte da destra a sinistra i lati si invertono."
MOD_PIXINDEX_OPTION_SIDE_END="In basso a destra"
MOD_PIXINDEX_OPTION_SIDE_START="In basso a sinistra"
MOD_PIXINDEX_FIELD_MOBILE_BREAKPOINT_LABEL="Larghezza smartphone (px)"
MOD_PIXINDEX_FIELD_MOBILE_BREAKPOINT_DESC="Sotto questa larghezza lo schermo è considerato uno smartphone o un tablet. Vale per «Indice sempre visibile», «Pulsante per smartphone» e «Richiudibile: chiuso solo su smartphone». 960 va bene per la maggior parte dei temi."
MOD_PIXINDEX_FIELD_BACK_LINK_LABEL="Link «Torna all'indice»"
MOD_PIXINDEX_FIELD_BACK_LINK_DESC="Aggiunge un piccolo link «Torna all'indice» prima di ogni capitolo, tranne il primo."
MOD_PIXINDEX_FIELD_BACK_LINK_TEXT_LABEL="Testo del link"
MOD_PIXINDEX_FIELD_BACK_LINK_TEXT_DESC="Lascia il valore predefinito per avere il testo tradotto in automatico in ogni lingua del sito, oppure scrivi il tuo testo."

; Section links tab
MOD_PIXINDEX_FIELD_ID_NUMBER_LABEL="Aggiungi il numero"
MOD_PIXINDEX_FIELD_ID_NUMBER_DESC="Inserisce nell'indirizzo il numero del capitolo, ad esempio #2-3-installazione invece di #installazione."
MOD_PIXINDEX_FIELD_ID_PARENTS_LABEL="Aggiungi i capitoli superiori"
MOD_PIXINDEX_FIELD_ID_PARENTS_DESC="Inserisce nell'indirizzo anche il titolo dei capitoli superiori, ad esempio #guida-installazione invece di #installazione. Utile se lo stesso titolo si ripete in capitoli diversi."
MOD_PIXINDEX_FIELD_ID_PREFIX_LABEL="Prefisso"
MOD_PIXINDEX_FIELD_ID_PREFIX_DESC="Testo aggiunto all'inizio di ogni indirizzo: ad esempio «cap-» produce #cap-installazione. Lascia vuoto per non aggiungere nulla."
MOD_PIXINDEX_FIELD_ID_NUMERIC_PREFIX_LABEL="Prefisso se inizia con un numero"
MOD_PIXINDEX_FIELD_ID_NUMERIC_PREFIX_DESC="Gli indirizzi che inizierebbero con un numero (ad esempio per il titolo «2024 in sintesi») ricevono questo prefisso, così restano validi. Lascia vuoto per non aggiungerlo."
MOD_PIXINDEX_FIELD_ID_REMOVE_WORDS_LABEL="Parole da togliere"
MOD_PIXINDEX_FIELD_ID_REMOVE_WORDS_DESC="Parole che non vuoi negli indirizzi, separate da virgola. Ad esempio: il, lo, la, di, e."

; Filters tab
MOD_PIXINDEX_FIELD_CONTENT_CONTAINERS_LABEL="Cerca i titoli solo in"
MOD_PIXINDEX_FIELD_CONTENT_CONTAINERS_DESC="Selettore CSS dell'elemento che contiene il testo dell'articolo: #nome per un id (ad esempio #corpoarticolo), .nome per una classe. Se la pagina contiene quell'elemento, l'indice considera solo i titoli al suo interno; altrimenti usa tutta la pagina. Il valore predefinito va bene per Joomla e Cassiopeia. Più selettori vanno separati da una virgola."
MOD_PIXINDEX_FIELD_NOINDEX_CLASSES_LABEL="Ignora i titoli con queste classi"
MOD_PIXINDEX_FIELD_NOINDEX_CLASSES_DESC="Classi CSS separate da virgola. Per escludere un singolo titolo basta aggiungergli nell'editor la classe noindex."
MOD_PIXINDEX_FIELD_NOINDEX_ATTRIBUTES_LABEL="Ignora i titoli con questi attributi"
MOD_PIXINDEX_FIELD_NOINDEX_ATTRIBUTES_DESC="Attributi HTML separati da virgola, con o senza valore. Il valore predefinito esclude il titolo dell'articolo."
MOD_PIXINDEX_FIELD_NOINDEX_CONTAINERS_LABEL="Ignora i titoli dentro"
MOD_PIXINDEX_FIELD_NOINDEX_CONTAINERS_DESC="Selettori CSS di elementi i cui titoli non devono finire nell'indice, separati da virgola: #nome per un id, .nome per una classe. .page-header è il blocco del titolo dell'articolo in Joomla."
MOD_PIXINDEX_FIELD_TITLE_CLASSES_LABEL="Titoli come intestazioni di gruppo"
MOD_PIXINDEX_FIELD_TITLE_CLASSES_DESC="Classi CSS separate da virgola. I titoli con una di queste classi compaiono nell'indice come intestazioni di gruppo, senza link."
MOD_PIXINDEX_FIELD_PAGES_NOTE_LABEL="In quali pagine mostrare il modulo"
MOD_PIXINDEX_FIELD_PAGES_NOTE_DESC="Si aggiungono all'assegnazione ai menu della scheda Menu."
MOD_PIXINDEX_FIELD_COMPONENTS_MODE_LABEL="Componenti"
MOD_PIXINDEX_FIELD_COMPONENTS_MODE_DESC="Ad esempio scegli «Solo quelli selezionati» e Articoli per mostrare il modulo solo nelle pagine degli articoli."
MOD_PIXINDEX_OPTION_COMPONENTS_ALL="Tutti"
MOD_PIXINDEX_OPTION_COMPONENTS_INCLUDE="Solo quelli selezionati"
MOD_PIXINDEX_OPTION_COMPONENTS_EXCLUDE="Tutti tranne quelli selezionati"
MOD_PIXINDEX_FIELD_COMPONENTS_LABEL="Componenti selezionati"
MOD_PIXINDEX_FIELD_CATEGORIES_MODE_LABEL="Categorie"
MOD_PIXINDEX_FIELD_CATEGORIES_MODE_DESC="Mostra il modulo solo negli articoli di alcune categorie, oppure in tutti tranne quelli."
MOD_PIXINDEX_OPTION_CATEGORIES_ALL="Tutte"
MOD_PIXINDEX_OPTION_CATEGORIES_INCLUDE="Solo quelle selezionate"
MOD_PIXINDEX_OPTION_CATEGORIES_EXCLUDE="Tutte tranne quelle selezionate"
MOD_PIXINDEX_FIELD_CATEGORIES_LABEL="Categorie selezionate"
MOD_PIXINDEX_FIELD_CATEGORIES_CHILDREN_LABEL="Comprese le sottocategorie"
MOD_PIXINDEX_FIELD_CATEGORIES_CHILDREN_DESC="No: solo le categorie selezionate. Sì: anche le loro sottocategorie. Solo sottocategorie: le sottocategorie ma non le categorie selezionate."
MOD_PIXINDEX_OPTION_ONLY_CHILDREN="Solo sottocategorie"
MOD_PIXINDEX_FIELD_SYNTAX_NOTE_LABEL="Comandi nel testo dell'articolo (facoltativi)"
MOD_PIXINDEX_FIELD_SYNTAX_NOTE_DESC="Scrivi {pixindex} nell'articolo per indicizzare solo i titoli che seguono e {/pixindex} per fermarti. Racchiudi una parte tra {pixindex-skip} e {/pixindex-skip} per escluderla. I comandi non sono mai visibili ai visitatori. Cambia le impostazioni qui sotto solo se un altro plugin usa già queste parole: i comandi già scritti negli articoli smetterebbero di funzionare."
MOD_PIXINDEX_FIELD_TAG_WORD_LABEL="Parola del comando"
MOD_PIXINDEX_FIELD_TAG_WORD_DESC="Parola usata in {pixindex} e {/pixindex}."
MOD_PIXINDEX_FIELD_NOINDEX_WORD_LABEL="Parola del comando di esclusione"
MOD_PIXINDEX_FIELD_NOINDEX_WORD_DESC="Parola usata in {pixindex-skip} e {/pixindex-skip}."
MOD_PIXINDEX_FIELD_TAG_CHARACTERS_LABEL="Parentesi dei comandi"
MOD_PIXINDEX_FIELD_TAG_CHARACTERS_DESC="Parentesi che racchiudono i comandi."

; CSS classes tab
MOD_PIXINDEX_FIELD_CLASS_CONTAINER_LABEL="Contenitore"
MOD_PIXINDEX_FIELD_CLASS_CONTAINER_DESC="Elemento esterno dell'indice. Ad esempio, nella visualizzazione Card il valore standard è card (Bootstrap) o uk-card uk-card-default uk-card-small (UIkit)."
MOD_PIXINDEX_FIELD_CLASS_TITLE_LABEL="Titolo"
MOD_PIXINDEX_FIELD_CLASS_TITLE_DESC="Titolo dell'indice."
MOD_PIXINDEX_FIELD_CLASS_BODY_LABEL="Corpo"
MOD_PIXINDEX_FIELD_CLASS_BODY_DESC="Elemento che contiene l'elenco."
MOD_PIXINDEX_FIELD_CLASS_LIST_LABEL="Elenco"
MOD_PIXINDEX_FIELD_CLASS_LIST_DESC="Elenco principale."
MOD_PIXINDEX_FIELD_CLASS_SUBLIST_LABEL="Elenchi dei sottocapitoli"
MOD_PIXINDEX_FIELD_CLASS_SUBLIST_DESC="Elenchi annidati dei sottocapitoli."
MOD_PIXINDEX_FIELD_CLASS_ITEM_LABEL="Voci"
MOD_PIXINDEX_FIELD_CLASS_ITEM_DESC="Ogni voce dell'elenco."
MOD_PIXINDEX_FIELD_CLASS_LINK_LABEL="Link delle voci"
MOD_PIXINDEX_FIELD_CLASS_LINK_DESC="Link di ogni voce."
MOD_PIXINDEX_FIELD_CLASS_LIST_TITLE_LABEL="Intestazioni di gruppo"
MOD_PIXINDEX_FIELD_CLASS_LIST_TITLE_DESC="Voci mostrate come intestazioni di gruppo (vedi scheda Filtri)."
MOD_PIXINDEX_FIELD_CLASS_HEADING_LABEL="Titoli nell'articolo"
MOD_PIXINDEX_FIELD_CLASS_HEADING_DESC="Classi aggiunte ai titoli dell'articolo che compaiono nell'indice."
MOD_PIXINDEX_FIELD_LOAD_CSS_LABEL="Carica il CSS del modulo"
MOD_PIXINDEX_FIELD_LOAD_CSS_DESC="Il piccolo file di stile del modulo (frecce, indice sempre visibile, pulsante per smartphone...). Non imposta mai font né colori. Disattivalo solo se vuoi gestire tutto lo stile nel tuo tema."
MOD_PIXINDEX_FIELD_HTML_COMMENTS_LABEL="Commenti HTML"
MOD_PIXINDEX_FIELD_HTML_COMMENTS_DESC="Aggiunge nel codice della pagina un commento all'inizio e alla fine del modulo. Serve solo a trovarlo più facilmente nel codice sorgente."
