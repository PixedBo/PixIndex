MOD_PIXINDEX="PixIndex - Table of Contents"
MOD_PIXINDEX_XML_DESCRIPTION="Automatically builds the table of contents of an article from its headings (h1-h6). Works with Cassiopeia (Bootstrap 5) and YOOtheme (UIkit 3), highlights the section being read and has a dedicated smartphone version."

; Front-end strings
MOD_PIXINDEX_INDEX_TITLE="Table of Contents"
MOD_PIXINDEX_BACK_TO_INDEX="Back to contents"
MOD_PIXINDEX_TOGGLE_SUBLEVELS="Show or hide the sub-sections of %s"

; Tabs
MOD_PIXINDEX_FIELDSET_LISTS="List"
MOD_PIXINDEX_FIELDSET_BEHAVIOUR="Behaviour"
MOD_PIXINDEX_FIELDSET_IDS="Section Links"
MOD_PIXINDEX_FIELDSET_FILTERS="Filters"
MOD_PIXINDEX_FIELDSET_STYLING="CSS Classes"

; Tab introductions
MOD_PIXINDEX_INTRO_BASIC="Choose the general look of the table of contents and which headings of the article it lists. To get started, <strong>Style Framework</strong> and <strong>Display</strong> are enough: every other setting of the module already has values that suit most sites."
MOD_PIXINDEX_INTRO_LISTS="Choose how the entries look: numbers or bullet points, numbering of the sub-sections, maximum length and text cleaning. These options only change the table of contents, never the headings in the article."
MOD_PIXINDEX_INTRO_BEHAVIOUR="Choose what happens when visitors use the table of contents and scroll the page: smooth scrolling, highlight of the section being read, sub-sections opening by themselves, an always visible table of contents and a smartphone button."
MOD_PIXINDEX_INTRO_IDS="Every section gets an address shown at the end of the link, for example <code>page.html#installation</code>. It lets the table of contents jump to the right place and lets visitors share the link to a single section. Usually there is nothing to change here."
MOD_PIXINDEX_INTRO_FILTERS="Choose which headings go into the table of contents and on which pages the module appears. The default values already leave out the article title and everything that is not part of the text (comments, custom fields): usually there is no need to change them."
MOD_PIXINDEX_INTRO_STYLING="For advanced users. Leave the fields empty to use the standard Bootstrap or UIkit classes chosen in the Module tab: the table of contents automatically takes the fonts and colors of your theme. Fill a field only to replace those classes with your own."
MOD_PIXINDEX_INTRO_ADVANCED="Standard Joomla settings shared by every module: alternative layout, module classes and HTML wrapper."

; Module tab
MOD_PIXINDEX_FIELD_FRAMEWORK_LABEL="Style Framework"
MOD_PIXINDEX_FIELD_FRAMEWORK_DESC="Choose according to your theme: Bootstrap 5 for Cassiopeia and Bootstrap based themes, UIkit 3 for YOOtheme Pro and UIkit based themes. «None» only uses a minimal style of the module."
MOD_PIXINDEX_OPTION_BOOTSTRAP5="Bootstrap 5 (Cassiopeia)"
MOD_PIXINDEX_OPTION_UIKIT3="UIkit 3 (YOOtheme)"
MOD_PIXINDEX_OPTION_NONE="None"
MOD_PIXINDEX_FIELD_DISPLAY_LABEL="Display"
MOD_PIXINDEX_FIELD_DISPLAY_DESC="Card: table of contents in a box with a header. List: title followed by a simple list. Navigation: vertical menu, ideal in a side column."
MOD_PIXINDEX_OPTION_DISPLAY_CARD="Card"
MOD_PIXINDEX_OPTION_DISPLAY_LIST="List"
MOD_PIXINDEX_OPTION_DISPLAY_NAV="Navigation"
MOD_PIXINDEX_FIELD_APPEARANCE_LABEL="Appearance"
MOD_PIXINDEX_FIELD_APPEARANCE_DESC="Glass: translucent box with a blurred background, thin border, rounded corners and entries highlighted on hover; the tints come from the theme text color, so it works with light and dark themes. Theme standard: only the Bootstrap or UIkit style."
MOD_PIXINDEX_OPTION_APPEARANCE_GLASS="Glass (glassmorphism)"
MOD_PIXINDEX_OPTION_APPEARANCE_THEME="Theme standard"
MOD_PIXINDEX_FIELD_COLLAPSIBLE_LABEL="Collapsible"
MOD_PIXINDEX_FIELD_COLLAPSIBLE_DESC="The title becomes a button that opens and closes the list (the title is then always shown). «Closed only on smartphones»: open on large screens, closed on small ones."
MOD_PIXINDEX_OPTION_COLLAPSIBLE_EXPANDED="Yes, open at first"
MOD_PIXINDEX_OPTION_COLLAPSIBLE_COLLAPSED="Yes, closed at first"
MOD_PIXINDEX_OPTION_COLLAPSIBLE_MOBILE="Yes, closed only on smartphones"
MOD_PIXINDEX_FIELD_SHOW_TITLE_LABEL="Title"
MOD_PIXINDEX_FIELD_SHOW_TITLE_DESC="Show a title above the table of contents."
MOD_PIXINDEX_FIELD_TITLE_LABEL="Title Text"
MOD_PIXINDEX_FIELD_TITLE_DESC="Keep the default value to have «Table of Contents» translated automatically in every site language, or write your own text."
MOD_PIXINDEX_FIELD_TITLE_TAG_LABEL="Title HTML Tag"
MOD_PIXINDEX_FIELD_TITLE_TAG_DESC="HTML tag of the title. h3 is fine in most cases."
MOD_PIXINDEX_FIELD_INDEX_MIN_LABEL="From Level"
MOD_PIXINDEX_FIELD_INDEX_MIN_DESC="First heading level included. With h2 (default) the table of contents starts from h2 headings and ignores h1, which is usually the page title."
MOD_PIXINDEX_FIELD_INDEX_MAX_LABEL="To Level"
MOD_PIXINDEX_FIELD_INDEX_MAX_DESC="Last heading level included. For example with h3 only h2 and h3 headings are listed."
MOD_PIXINDEX_FIELD_EXCLUDE_LEVELS_LABEL="Exclude Levels"
MOD_PIXINDEX_FIELD_EXCLUDE_LEVELS_DESC="Heading levels always ignored, even when they are between «From Level» and «To Level»."
MOD_PIXINDEX_FIELD_MIN_HEADINGS_LABEL="Minimum Entries"
MOD_PIXINDEX_FIELD_MIN_HEADINGS_DESC="When the article has fewer headings than this number, the module is not shown."

; List tab
MOD_PIXINDEX_FIELD_ORDERED_LABEL="Numbered Entries"
MOD_PIXINDEX_FIELD_ORDERED_DESC="Choose whether the entries are numbered (1, 2, 3...) or not. With «Different for each level» you decide level by level: level 1 is the first level of the table of contents, levels 2, 3... are the sub-sections."
MOD_PIXINDEX_OPTION_ORDERED_YES="Yes"
MOD_PIXINDEX_OPTION_ORDERED_NO="No"
MOD_PIXINDEX_OPTION_ORDERED_CUSTOM="Different for each level"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_LABEL="Numbering Type"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_DESC="Numbers, letters or roman numerals."
MOD_PIXINDEX_OPTION_STYLE_NUMBERS="1, 2, 3"
MOD_PIXINDEX_OPTION_STYLE_LETTERS="A, B, C"
MOD_PIXINDEX_OPTION_STYLE_LETTERS_LOWERCASE="a, b, c"
MOD_PIXINDEX_OPTION_STYLE_ROMAN="I, II, III"
MOD_PIXINDEX_OPTION_STYLE_ROMAN_LOWERCASE="i, ii, iii"
MOD_PIXINDEX_FIELD_ORDERED_1_LABEL="Level 1 Numbered"
MOD_PIXINDEX_FIELD_ORDERED_2_LABEL="Level 2 Numbered"
MOD_PIXINDEX_FIELD_ORDERED_3_LABEL="Level 3 Numbered"
MOD_PIXINDEX_FIELD_ORDERED_4_LABEL="Level 4 Numbered"
MOD_PIXINDEX_FIELD_ORDERED_5_LABEL="Level 5 Numbered"
MOD_PIXINDEX_FIELD_ORDERED_6_LABEL="Level 6 Numbered"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_1_LABEL="Level 1: Numbering Type"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_2_LABEL="Level 2: Numbering Type"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_3_LABEL="Level 3: Numbering Type"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_4_LABEL="Level 4: Numbering Type"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_5_LABEL="Level 5: Numbering Type"
MOD_PIXINDEX_FIELD_ORDERED_STYLE_6_LABEL="Level 6: Numbering Type"
MOD_PIXINDEX_FIELD_INDEX_NUMBERING_LABEL="Sub-section Numbers"
MOD_PIXINDEX_FIELD_INDEX_NUMBERING_DESC="Simple: sub-sections start again from 1 (1, 2, 3). Full: every entry also shows the number of its parent section (2.1, 2.2, 2.3). The Navigation display always uses full numbers."
MOD_PIXINDEX_OPTION_NUMBERING_MARKERS="Simple (1, 2, 3)"
MOD_PIXINDEX_OPTION_NUMBERING_HIERARCHICAL="Full (2.1, 2.2, 2.3)"
MOD_PIXINDEX_FIELD_NUMBER_SEPARATOR_LABEL="Character After the Number"
MOD_PIXINDEX_FIELD_NUMBER_SEPARATOR_DESC="Character shown after full numbers, for example the final dot in «2.3.». It can be left empty."
MOD_PIXINDEX_FIELD_LIST_BULLETS_LABEL="Bullet Points"
MOD_PIXINDEX_FIELD_LIST_BULLETS_DESC="Show or hide the dot in front of entries that are not numbered. Sub-sections stay indented anyway."
MOD_PIXINDEX_FIELD_TRUNCATE_LENGTH_LABEL="Maximum Entry Length (characters)"
MOD_PIXINDEX_FIELD_TRUNCATE_LENGTH_DESC="Entries longer than this number of characters (spaces included) are shortened and end with «…». Hovering the entry shows the full heading. 0 = no limit."
MOD_PIXINDEX_FIELD_TRUNCATE_WHOLE_WORDS_LABEL="Keep Whole Words"
MOD_PIXINDEX_FIELD_TRUNCATE_WHOLE_WORDS_DESC="Yes: when the limit falls in the middle of a word, the word is completed and the ellipsis comes right after it (so the entry can be slightly longer than the limit). No: the text is cut exactly at the chosen number of characters."
MOD_PIXINDEX_FIELD_REMOVE_HTML_LABEL="Plain Text Only"
MOD_PIXINDEX_FIELD_REMOVE_HTML_DESC="Yes: entries show only the heading text. No: they keep the simple formatting of the heading, such as bold, italic or code."
MOD_PIXINDEX_FIELD_SANITIZE_TITLES_LABEL="Remove Emoji and Symbols"
MOD_PIXINDEX_FIELD_SANITIZE_TITLES_DESC="Cleans the text of the entries. «Emoji only»: removes emoji, icons and invisible characters. «Emoji and symbols»: also removes stars, check marks, arrows and dashes or colons at the start and at the end. The headings in the article are never changed."
MOD_PIXINDEX_OPTION_SANITIZE_EMOJI="Emoji only"
MOD_PIXINDEX_OPTION_SANITIZE_STRICT="Emoji and symbols"

; Behaviour tab
MOD_PIXINDEX_FIELD_SMOOTH_SCROLL_LABEL="Smooth Scrolling"
MOD_PIXINDEX_FIELD_SMOOTH_SCROLL_DESC="Clicking an entry smoothly scrolls the page to the section instead of jumping. Visitors who asked their device for reduced motion still get an instant jump."
MOD_PIXINDEX_FIELD_SCROLL_OFFSET_LABEL="Space Above the Section (px)"
MOD_PIXINDEX_FIELD_SCROLL_OFFSET_DESC="If your site has a fixed menu at the top, enter its height here: the section heading will not end up hidden under the menu. 0 = no space."
MOD_PIXINDEX_FIELD_SCROLLSPY_LABEL="Highlight the Section Being Read"
MOD_PIXINDEX_FIELD_SCROLLSPY_DESC="While the visitor scrolls the page, the entry of the section being read is highlighted."
MOD_PIXINDEX_FIELD_ACTIVE_STYLE_LABEL="Highlight Style"
MOD_PIXINDEX_FIELD_ACTIVE_STYLE_DESC="Always uses your theme colors. «Background and side bar»: the entry gets a lighter background on dark themes (darker on light themes) and a bar on the left in the link color. Automatic: background and side bar, except in the Bootstrap Navigation where the active entry is already highlighted."
MOD_PIXINDEX_OPTION_ACTIVE_AUTO="Automatic"
MOD_PIXINDEX_OPTION_ACTIVE_HIGHLIGHT="Background and side bar"
MOD_PIXINDEX_OPTION_ACTIVE_UNDERLINE="Underline"
MOD_PIXINDEX_OPTION_ACTIVE_BOLD="Bold"
MOD_PIXINDEX_OPTION_ACTIVE_LINE="Side line"
MOD_PIXINDEX_OPTION_ACTIVE_NONE="Let the theme decide"
MOD_PIXINDEX_FIELD_COLLAPSE_SUBLEVELS_LABEL="Collapsible Sub-sections"
MOD_PIXINDEX_FIELD_COLLAPSE_SUBLEVELS_DESC="Useful for long tables of contents. Entries with sub-sections get an arrow button to open and close them with a short animation, and they start closed. While scrolling, the group of the section being read opens by itself; groups opened by hand stay open."
MOD_PIXINDEX_FIELD_STICKY_LABEL="Always Visible"
MOD_PIXINDEX_FIELD_STICKY_DESC="The table of contents stays on screen while the page scrolls: ideal in a side column. Only on screens wider than the «Smartphone Width»."
MOD_PIXINDEX_FIELD_STICKY_TOP_LABEL="Distance From the Top (px)"
MOD_PIXINDEX_FIELD_STICKY_TOP_DESC="Space between the top of the screen and the table of contents. If your site has a fixed menu at the top, use a value a little larger than its height."
MOD_PIXINDEX_FIELD_MAX_HEIGHT_LABEL="Maximum Height (px)"
MOD_PIXINDEX_FIELD_MAX_HEIGHT_DESC="If the table of contents is taller than this value, an inner scrollbar appears. 0 = no limit."
MOD_PIXINDEX_FIELD_MOBILE_PANEL_LABEL="Smartphone Button"
MOD_PIXINDEX_FIELD_MOBILE_PANEL_DESC="On small screens the table of contents is hidden and a round button appears at the bottom instead: tapping it opens the table of contents in a side panel."
MOD_PIXINDEX_FIELD_MOBILE_PANEL_SIDE_LABEL="Button Position"
MOD_PIXINDEX_FIELD_MOBILE_PANEL_SIDE_DESC="Corner of the button and side the panel opens from. On sites written right to left the sides are swapped."
MOD_PIXINDEX_OPTION_SIDE_END="Bottom right"
MOD_PIXINDEX_OPTION_SIDE_START="Bottom left"
MOD_PIXINDEX_FIELD_MOBILE_BREAKPOINT_LABEL="Smartphone Width (px)"
MOD_PIXINDEX_FIELD_MOBILE_BREAKPOINT_DESC="Below this width the screen is treated as a smartphone or tablet. Used by «Always Visible», «Smartphone Button» and «Collapsible: closed only on smartphones». 960 suits most themes."
MOD_PIXINDEX_FIELD_BACK_LINK_LABEL="«Back to contents» Links"
MOD_PIXINDEX_FIELD_BACK_LINK_DESC="Adds a small «Back to contents» link before every section except the first one."
MOD_PIXINDEX_FIELD_BACK_LINK_TEXT_LABEL="Link Text"
MOD_PIXINDEX_FIELD_BACK_LINK_TEXT_DESC="Keep the default value to have the text translated automatically in every site language, or write your own text."

; Section links tab
MOD_PIXINDEX_FIELD_ID_NUMBER_LABEL="Add the Number"
MOD_PIXINDEX_FIELD_ID_NUMBER_DESC="Puts the section number in the address, for example #2-3-installation instead of #installation."
MOD_PIXINDEX_FIELD_ID_PARENTS_LABEL="Add the Parent Sections"
MOD_PIXINDEX_FIELD_ID_PARENTS_DESC="Also puts the titles of the parent sections in the address, for example #guide-installation instead of #installation. Useful when the same title appears in different sections."
MOD_PIXINDEX_FIELD_ID_PREFIX_LABEL="Prefix"
MOD_PIXINDEX_FIELD_ID_PREFIX_DESC="Text added at the start of every address: for example «sec-» gives #sec-installation. Leave empty to add nothing."
MOD_PIXINDEX_FIELD_ID_NUMERIC_PREFIX_LABEL="Prefix When It Starts With a Number"
MOD_PIXINDEX_FIELD_ID_NUMERIC_PREFIX_DESC="Addresses that would start with a number (for example for the title «2024 in short») get this prefix, so they stay valid. Leave empty to add nothing."
MOD_PIXINDEX_FIELD_ID_REMOVE_WORDS_LABEL="Words to Remove"
MOD_PIXINDEX_FIELD_ID_REMOVE_WORDS_DESC="Words you do not want in the addresses, separated by commas. For example: the, a, an, of, and."

; Filters tab
MOD_PIXINDEX_FIELD_CONTENT_CONTAINERS_LABEL="Look for Headings Only In"
MOD_PIXINDEX_FIELD_CONTENT_CONTAINERS_DESC="CSS selector of the element holding the article text: #name for an id (for example #articlebody), .name for a class. When the page has this element, only the headings inside it are used; otherwise the whole page. The default value suits Joomla and Cassiopeia. Separate several selectors with a comma."
MOD_PIXINDEX_FIELD_NOINDEX_CLASSES_LABEL="Ignore Headings With These Classes"
MOD_PIXINDEX_FIELD_NOINDEX_CLASSES_DESC="CSS classes separated by commas. To leave out a single heading, just give it the noindex class in the editor."
MOD_PIXINDEX_FIELD_NOINDEX_ATTRIBUTES_LABEL="Ignore Headings With These Attributes"
MOD_PIXINDEX_FIELD_NOINDEX_ATTRIBUTES_DESC="HTML attributes separated by commas, with or without a value. The default value leaves out the article title."
MOD_PIXINDEX_FIELD_NOINDEX_CONTAINERS_LABEL="Ignore Headings Inside"
MOD_PIXINDEX_FIELD_NOINDEX_CONTAINERS_DESC="CSS selectors of elements whose headings must not be listed, separated by commas: #name for an id, .name for a class. .page-header is the article title block in Joomla."
MOD_PIXINDEX_FIELD_TITLE_CLASSES_LABEL="Headings as Group Titles"
MOD_PIXINDEX_FIELD_TITLE_CLASSES_DESC="CSS classes separated by commas. Headings with one of these classes are shown as group titles, without a link."
MOD_PIXINDEX_FIELD_PAGES_NOTE_LABEL="On Which Pages to Show the Module"
MOD_PIXINDEX_FIELD_PAGES_NOTE_DESC="These filters add to the menu assignment of the Menu Assignment tab."
MOD_PIXINDEX_FIELD_COMPONENTS_MODE_LABEL="Components"
MOD_PIXINDEX_FIELD_COMPONENTS_MODE_DESC="For example choose «Only the selected ones» and Articles to show the module only on article pages."
MOD_PIXINDEX_OPTION_COMPONENTS_ALL="All"
MOD_PIXINDEX_OPTION_COMPONENTS_INCLUDE="Only the selected ones"
MOD_PIXINDEX_OPTION_COMPONENTS_EXCLUDE="All except the selected ones"
MOD_PIXINDEX_FIELD_COMPONENTS_LABEL="Selected Components"
MOD_PIXINDEX_FIELD_CATEGORIES_MODE_LABEL="Categories"
MOD_PIXINDEX_FIELD_CATEGORIES_MODE_DESC="Show the module only in the articles of some categories, or in every article except those."
MOD_PIXINDEX_OPTION_CATEGORIES_ALL="All"
MOD_PIXINDEX_OPTION_CATEGORIES_INCLUDE="Only the selected ones"
MOD_PIXINDEX_OPTION_CATEGORIES_EXCLUDE="All except the selected ones"
MOD_PIXINDEX_FIELD_CATEGORIES_LABEL="Selected Categories"
MOD_PIXINDEX_FIELD_CATEGORIES_CHILDREN_LABEL="Including Sub-categories"
MOD_PIXINDEX_FIELD_CATEGORIES_CHILDREN_DESC="No: only the selected categories. Yes: their sub-categories too. Sub-categories only: the sub-categories but not the selected categories."
MOD_PIXINDEX_OPTION_ONLY_CHILDREN="Sub-categories only"
MOD_PIXINDEX_FIELD_SYNTAX_NOTE_LABEL="Commands in the Article Text (optional)"
MOD_PIXINDEX_FIELD_SYNTAX_NOTE_DESC="Write {pixindex} in the article to list only the headings that follow, and {/pixindex} to stop. Wrap a part between {pixindex-skip} and {/pixindex-skip} to leave it out. Visitors never see the commands. Change the settings below only if another plugin already uses these words: commands already written in the articles would stop working."
MOD_PIXINDEX_FIELD_TAG_WORD_LABEL="Command Word"
MOD_PIXINDEX_FIELD_TAG_WORD_DESC="Word used in {pixindex} and {/pixindex}."
MOD_PIXINDEX_FIELD_NOINDEX_WORD_LABEL="Exclusion Command Word"
MOD_PIXINDEX_FIELD_NOINDEX_WORD_DESC="Word used in {pixindex-skip} and {/pixindex-skip}."
MOD_PIXINDEX_FIELD_TAG_CHARACTERS_LABEL="Command Brackets"
MOD_PIXINDEX_FIELD_TAG_CHARACTERS_DESC="Brackets around the commands."

; CSS classes tab
MOD_PIXINDEX_FIELD_CLASS_CONTAINER_LABEL="Container"
MOD_PIXINDEX_FIELD_CLASS_CONTAINER_DESC="Outer element of the table of contents. For example, in the Card display the standard value is card (Bootstrap) or uk-card uk-card-default uk-card-small (UIkit)."
MOD_PIXINDEX_FIELD_CLASS_TITLE_LABEL="Title"
MOD_PIXINDEX_FIELD_CLASS_TITLE_DESC="Title of the table of contents."
MOD_PIXINDEX_FIELD_CLASS_BODY_LABEL="Body"
MOD_PIXINDEX_FIELD_CLASS_BODY_DESC="Element holding the list."
MOD_PIXINDEX_FIELD_CLASS_LIST_LABEL="List"
MOD_PIXINDEX_FIELD_CLASS_LIST_DESC="Main list."
MOD_PIXINDEX_FIELD_CLASS_SUBLIST_LABEL="Sub-section Lists"
MOD_PIXINDEX_FIELD_CLASS_SUBLIST_DESC="Nested lists of the sub-sections."
MOD_PIXINDEX_FIELD_CLASS_ITEM_LABEL="Entries"
MOD_PIXINDEX_FIELD_CLASS_ITEM_DESC="Every entry of the list."
MOD_PIXINDEX_FIELD_CLASS_LINK_LABEL="Entry Links"
MOD_PIXINDEX_FIELD_CLASS_LINK_DESC="Link of every entry."
MOD_PIXINDEX_FIELD_CLASS_LIST_TITLE_LABEL="Group Titles"
MOD_PIXINDEX_FIELD_CLASS_LIST_TITLE_DESC="Entries shown as group titles (see the Filters tab)."
MOD_PIXINDEX_FIELD_CLASS_HEADING_LABEL="Headings in the Article"
MOD_PIXINDEX_FIELD_CLASS_HEADING_DESC="Classes added to the article headings that appear in the table of contents."
MOD_PIXINDEX_FIELD_LOAD_CSS_LABEL="Load the Module CSS"
MOD_PIXINDEX_FIELD_LOAD_CSS_DESC="The small stylesheet of the module (arrows, always visible table of contents, smartphone button...). It never sets fonts or colors. Turn it off only to handle all the styling in your theme."
MOD_PIXINDEX_FIELD_HTML_COMMENTS_LABEL="HTML Comments"
MOD_PIXINDEX_FIELD_HTML_COMMENTS_DESC="Adds a comment at the start and at the end of the module in the page code. Only useful to find it quickly in the page source."
